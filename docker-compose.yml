# Default (`docker compose up -d`): ONLY Postgres. Run the backend and frontend on the host (see DEMO.md): no bind-mount
# file watching, no multi-GB torch image, no second ML process. The video analysis runs inside the backend process,
# so there is no Redis and no worker container.
#
# `docker compose --profile app up --build` also runs backend + frontend in containers (slower; for deploy checks).
#
# `environment:` takes precedence over `env_file:`. The repo .env is written for HOST-side runs
# (DATABASE_URL=...@localhost:5432/...). Inside a container `localhost` is the container itself, so without this
# override the backend cannot reach Postgres. Host-side (non-Docker) runs never see this file.
x-container-env: &container-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-injury_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-injury_detection}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-injury_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-injury_detection}
  UPLOAD_DIR: /uploads

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injury_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-injury_detection}
    ports:
      # POSTGRES_PORT defaults to 5432; override in .env if the host port is taken
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-injury_user} -d ${POSTGRES_DB:-injury_detection}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: [app]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *container-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/uploads

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
