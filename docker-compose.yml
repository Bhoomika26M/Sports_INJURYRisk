# Container-correct service URLs for the backend and the arq worker.
#
# `environment:` takes precedence over `env_file:`. The repo .env is written for HOST-side runs
# (DATABASE_URL=...@localhost:5433/..., REDIS_URL=redis://localhost:6379/...). Inside a container
# `localhost` is the container itself, so without this override the backend cannot reach Postgres.
# Host-side (non-Docker) runs are unaffected: they read .env directly and never see this file.
x-container-env: &container-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-injury_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-injury_detection}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-injury_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-injury_detection}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injury_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-injury_detection}
    ports:
      # POSTGRES_PORT defaults to 5432; override in .env if the host port is taken
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-injury_user} -d ${POSTGRES_DB:-injury_detection}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *container-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./test-assets:/test-assets
      - uploads:/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  arq_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *container-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./test-assets:/test-assets
      - uploads:/uploads
    command: arq app.modules.pose.worker_settings.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  uploads: