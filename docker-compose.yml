version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: athletiq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sports_injury_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_injury_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - athletiq_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athletiq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sports_injury_db
      - SECRET_KEY=${SECRET_KEY:-athletiq-super-secret-jwt-key-2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - UPLOAD_DIR=/uploads
      - MAX_VIDEO_SIZE_MB=500
      - MAX_VIDEO_DURATION_SEC=300
      - UVICORN_WORKERS=2
      - SEED_DEMO_DATA=false
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80","http://127.0.0.1:5173","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - athletiq_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athletiq_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - athletiq_network

volumes:
  postgres_data:
    name: athletiq_postgres_data
  uploads_data:
    name: athletiq_uploads_data

networks:
  athletiq_network:
    name: athletiq_network
    driver: bridge
