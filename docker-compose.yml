version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sports_injury_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_password}
      POSTGRES_DB: ${POSTGRES_DB:-sports_injury_risk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sports_injury_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports_user}:${POSTGRES_PASSWORD:-sports_password}@postgres:5432/${POSTGRES_DB:-sports_injury_risk}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
