<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Badge -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Kinematic Lightning / Biomechanics Pulse -->
  <path d="M17.5 4.5 L7.5 16.5 L15 16.5 L13 27.5 L24.5 14.5 L17 14.5 Z" 
        fill="url(#pulseGrad)" 
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="0.75"
        stroke-linejoin="round"/>
        
  <!-- Joint Node Highlight Dot -->
  <circle cx="21" cy="9.5" r="1.75" fill="#4ade80" stroke="#ffffff" stroke-width="0.75"/>
</svg>
