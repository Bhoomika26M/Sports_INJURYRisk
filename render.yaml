# ==============================================================================
# AthletiQ Sports Movement Screening Platform - Render Blueprint (Free Tier)
# ==============================================================================
services:
  # 1. FastAPI AI Pose Estimation Backend (Free Web Service)
  - type: web
    name: athletiq-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: UVICORN_WORKERS
        value: "1"
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      # SQLite database in persistent /tmp directory (zero configuration, free)
      - key: DATABASE_URL_OVERRIDE
        value: sqlite:////tmp/sports_injury.db
      - key: ADMIN_REGISTRATION_CODE
        value: admin-secret-key-2026

  # 2. React / Vite Frontend (Free Static Site)
  - type: web
    name: athletiq-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: athletiq-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "%s/api/v1"
