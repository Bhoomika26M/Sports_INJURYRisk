name: CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Pytest & Type Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: injury_detection_test
          POSTGRES_USER: injury_user
          POSTGRES_PASSWORD: changeme_in_production
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (OpenCV & MediaPipe Headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install Python Dependencies (CPU Torch First)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://injury_user:changeme_in_production@localhost:5433/injury_detection_test
          TEST_DATABASE_URL: postgresql+asyncpg://injury_user:changeme_in_production@localhost:5433/injury_detection_test
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://injury_user:changeme_in_production@localhost:5433/injury_detection_test
          TEST_DATABASE_URL: postgresql+asyncpg://injury_user:changeme_in_production@localhost:5433/injury_detection_test
          JWT_SECRET_KEY: test_secret_key_only_for_ci_environment_not_prod
        run: |
          pytest -v

  frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: npx eslint src

      - name: Next.js Production Build
        working-directory: frontend
        run: npm run build
